{% extends "base.html" %}
{% block title %}Create Account - {{ app_name }}{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand">
      <i class="bi bi-piggy-bank-fill"></i>
      <h2>Create your account</h2>
      <p>Start tracking, budgeting, and saving smarter today.</p>
    </div>
    <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" class="form-control" name="name" required value="{{ form.get('name','') }}" placeholder="Priya Sharma">
      </div>
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" name="email" required value="{{ form.get('email','') }}" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">I am a...</label>
        <select class="form-select" name="user_type">
          {% for t in user_types %}
          <option value="{{ t }}" {% if form.get('user_type') == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required placeholder="At least 6 characters">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Confirm password</label>
          <input type="password" class="form-control" name="confirm_password" required placeholder="Repeat password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
